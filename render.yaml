services:
  - type: web
    name: reelrank-movie-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: REELRANK_DATA_DIR
        value: /tmp/reelrank
      - key: REELRANK_SECRET_KEY
        generateValue: true
      - key: REELRANK_DEMO_EMAIL
        value: demo@example.com
      - key: REELRANK_DEMO_PASSWORD
        value: ReelRankDemo2026!
