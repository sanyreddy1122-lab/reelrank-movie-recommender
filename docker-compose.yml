services:
  recommender:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data
    restart: unless-stopped
  mlflow:
    profiles: ["mlops"]
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

volumes:
  mlflow-data:
