name: ReelRank CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  evaluate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-mlops.txt
      - name: Evaluate and track recommendation baseline
        run: python scripts/evaluate.py
      - name: Generate data drift report
        run: python scripts/data_drift_report.py
      - name: Keep evaluation and drift reports
        uses: actions/upload-artifact@v4
        with:
          name: mlops-reports
          path: |
            reports/
            mlruns/
          if-no-files-found: error
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag reelrank:ci
